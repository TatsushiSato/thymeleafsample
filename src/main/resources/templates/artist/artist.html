<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" rel="stylesheet" />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
    <title>アーティスト詳細</title>
</head>
<body>
<div id="header" th:replace="~{layout :: header}"></div>
<div class="container-fluid">
    <div id="carouselExampleCaptions" class="carousel slide h-25 mx-auto" data-bs-interval="false">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img th:src="'/pic' + ${artist.artistArtUrl} + '1.png'" class="d-block w-100 opacity-75 object-fit-cover " alt="..." height="500">
                <!-- <img src="images/hero1.jpg" width="1920" height="550" class="d-block w-100 opacity-75" alt="..."> -->
                <div class="carousel-caption text-dark-emphasis d-none d-md-block">
                    <h2 class="display-3" th:text="${artist.artistName}"></h2>
                    <p class="lead">
                    <p th:text="${artist.caption}">
                    </p>
                </div>
            </div>
            <div class="carousel-item">
                <img th:src="'/pic' + ${artist.artistArtUrl} + '1.png'" class="d-block w-100 opacity-75 object-fit-cover " alt="..." height="500">
                <div class="carousel-caption text-dark-emphasis d-none d-md-block">
                    <h2 class="display-3" th:text="${artist.artistName}"></h2>
                    <p class="lead">
                    <p th:text="${artist.caption}">
                    </p>
                </div>
            </div>
            <div class="carousel-item">
                <img th:src="'/pic' + ${artist.artistArtUrl} + '1.png'" class="d-block w-100 opacity-75 object-fit-cover " alt="..." height="500">
                <div class="carousel-caption text-dark-emphasis d-none d-md-block">
                    <h2 class="display-3" th:text="${artist.artistName}"></h2>
                    <p class="lead">
                    <p th:text="${artist.caption}">
                    </p>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <div class="panel-group">
        <div class="container mt-5 py-5">
        <div class="row row-cols-4 row-cols-md-2 row-cols-xxl-4 g-4">
        <div class="card" th:each="member : ${artist.members}">
            <img src="/pic/member/member.png" class="card-img-top rounded-circle" alt="...">
            <div class="card-body">
                <h3  class="card-title" th:text="${member.memberName}"></h3>
                <p class="card-text"  th:text="${member.memberBirthday} + '生まれ'"></p>
            </div>
        </div>
        </div>
        </div>
        <div class="panel panel-default align-items-center">
            <h2 data-bs-toggle="collapse" href="#collapse2" aria-expanded="false" aria-controls="collapseExample">メンバー</h2>

        </div>
        <div id="collapse2" class="panel-collapse collapse">
            <table class="table table-bordered mt-3">
                <tr>
                    <th>メンバー名</th>
                    <th>メンバー名(読み)</th>
                    <th>年齢</th>
                    <th>誕生日</th>
                </tr>
                <tr th:each="member: ${artist.members}">
                    <td th:text="${member.memberName}"></td>
                    <td th:text="${member.memberHiraganaName}"></td>
                    <td th:text="${member.getAge()}"></td>
                    <td th:text="${member.memberBirthday}"></td>
                </tr>
            </table>
        </div>
    </div>
</div>


<div id="footer" th:replace="~{layout :: footer}"></div>
</body>
</html>
