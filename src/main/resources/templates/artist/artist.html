<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" rel="stylesheet" />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
    <title>アーティスト詳細</title>
</head>
<body>
<div id="header" th:replace="~{layout :: header}"></div>
<div class="container">
    <img th:src="@{/pic/nogizaka.png}" class="img-fluid" alt="Responsive image">
    <h1 th:text="${artist.artistName}"></h1>

    <div class="panel-group">
        <div class="panel panel-default">
            <button type="button" class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#collapse2" aria-expanded="false" aria-controls="collapseExample">
                メンバー
            </button>
        </div>
        <div id="collapse2" class="panel-collapse collapse">
            <table class="table table-bordered mt-3">
                <tr>
                    <th>メンバー名</th>
                    <th>メンバー名(読み)</th>
                    <th>年齢</th>
                    <th>誕生日</th>
                </tr>
                <tr th:each="member: ${artist.members}">
                    <td th:text="${member.memberName}"></td>
                    <td th:text="${member.memberHiraganaName}"></td>
                    <td th:text="${member.getAge()}"></td>
                    <td th:text="${member.memberBirthday}"></td>
                </tr>
            </table>
        </div>
    </div>

</div>


<div id="footer" th:replace="~{layout :: footer}"></div>
</body>
</html>
